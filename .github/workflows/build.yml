name: Build BworldMarket

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Maven ile derle
        run: mvn -B package --file pom.xml

      - name: Jar dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: BworldMarket
          path: target/BworldMarket.jar
